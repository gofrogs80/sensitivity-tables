<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deal Sheet. — Rental Property Sensitivity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101B14;
    --ink-panel:#182619;
    --ink-panel-2:#1F3123;
    --paper:#EEF2E6;
    --paper-rule:#D3DFC7;
    --ledger:#2F5D3A;
    --ledger-deep:#1F4029;
    --brass:#B8863B;
    --brass-light:#E4C077;
    --text:#1C2820;
    --muted:#61705F;
    --muted-light:#9BB093;
    --red:#9A3A2C;
    --red-bg:#F1D6CD;
    --green-bg:#D7E7CC;
    --neutral-bg:#E4E9DA;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    font-family:var(--font-body);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .shell{
    max-width:1280px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  .masthead{
    color:var(--paper);
    padding:6px 6px 22px;
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--brass-light);
    margin:0 0 8px;
  }
  .masthead h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(32px,4.4vw,46px);
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .masthead p{
    margin:0;
    color:var(--muted-light);
    font-size:14.5px;
    max-width:560px;
    line-height:1.5;
  }
  .app{
    display:flex;
    align-items:stretch;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.55);
  }
  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:340px;
    flex:0 0 340px;
    background:var(--ink-panel);
    background-image:linear-gradient(180deg, var(--ink-panel-2), var(--ink-panel) 140px);
    color:#DCE6D3;
    padding:26px 22px 30px;
  }
  .sidebar-title{
    font-family:var(--font-display);
    font-size:19px;
    color:#F1F5EA;
    margin:0 0 2px;
  }
  .sidebar-sub{
    font-size:12px;
    color:var(--muted-light);
    margin:0 0 22px;
  }
  .field-group{ margin-bottom:22px; }
  .field-group-label{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--brass-light);
    border-bottom:1px solid rgba(228,192,119,.25);
    padding-bottom:6px;
    margin-bottom:12px;
  }
  .field{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:7px 0;
    border-bottom:1px solid rgba(255,255,255,.07);
  }
  .field label{
    font-size:12.5px;
    color:#CBD7C0;
    line-height:1.3;
  }
  .field-input{
    display:flex;
    align-items:center;
    background:rgba(0,0,0,.28);
    border:1px solid rgba(255,255,255,.12);
    border-radius:5px;
    padding:0 8px;
    flex:0 0 118px;
  }
  .field-input.focus-ring:focus-within{
    border-color:var(--brass-light);
  }
  .field-input span{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--muted-light);
  }
  .field-input input{
    width:100%;
    background:transparent;
    border:none;
    outline:none;
    color:#F1F5EA;
    font-family:var(--font-mono);
    font-size:13px;
    padding:7px 4px;
    text-align:right;
  }
  .field-input input::-webkit-outer-spin-button,
  .field-input input::-webkit-inner-spin-button{ opacity:0.4; }

  /* ---------- MAIN ---------- */
  .main{
    flex:1;
    min-width:0;
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper-rule) 1px, transparent 1px);
    background-size:100% 34px;
    padding:26px 30px 40px;
  }
  .summary-strip{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:26px;
  }
  .stat{
    background:#F8FAF4;
    border:1px solid var(--paper-rule);
    border-top:3px solid var(--ledger);
    border-radius:6px;
    padding:12px 14px;
  }
  .stat .k{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:4px;
  }
  .stat .v{
    font-family:var(--font-mono);
    font-size:19px;
    font-weight:600;
    color:var(--text);
  }
  .stat.highlight{ border-top-color:var(--brass); }
  .stat.highlight .v{ color:var(--ledger-deep); }
  .stat .v.neg{ color:var(--red); }

  .view-switch{
    display:inline-flex;
    background:#E4E9DA;
    border:1px solid var(--paper-rule);
    border-radius:7px;
    padding:3px;
    margin-bottom:22px;
  }
  .view-switch button{
    font-family:var(--font-body);
    font-weight:600;
    font-size:12.5px;
    border:none;
    background:transparent;
    color:var(--muted);
    padding:8px 16px;
    border-radius:5px;
    cursor:pointer;
  }
  .view-switch button.active{
    background:var(--ledger);
    color:#F4F7EE;
  }

  .panel-title{
    font-family:var(--font-display);
    font-size:20px;
    margin:0 0 3px;
  }
  .panel-sub{
    font-size:13px;
    color:var(--muted);
    margin:0 0 18px;
    max-width:640px;
    line-height:1.5;
  }

  .controls-row{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:20px;
    align-items:flex-end;
  }
  .control{
    background:#F8FAF4;
    border:1px solid var(--paper-rule);
    border-radius:7px;
    padding:10px 12px;
  }
  .control label{
    display:block;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }
  .control select, .control input[type=number]{
    font-family:var(--font-body);
    font-size:13px;
    border:1px solid var(--paper-rule);
    border-radius:5px;
    padding:6px 8px;
    background:#fff;
    color:var(--text);
  }
  .range-inputs{ display:flex; gap:6px; align-items:center; }
  .range-inputs input{ width:70px; font-family:var(--font-mono); }
  .range-inputs .sep{ color:var(--muted); font-size:11px; }

  /* ---------- TABLE ---------- */
  .table-wrap{
    overflow-x:auto;
    border:1px solid var(--paper-rule);
    border-radius:8px;
    background:#F8FAF4;
  }
  table.sens{
    border-collapse:collapse;
    width:100%;
    font-family:var(--font-mono);
    font-size:12.5px;
  }
  table.sens th, table.sens td{
    border:1px solid var(--paper-rule);
    padding:9px 12px;
    text-align:right;
    white-space:nowrap;
  }
  table.sens thead th{
    background:var(--ledger);
    color:#F4F7EE;
    font-weight:600;
  }
  table.sens thead tr.axis-label th{
    background:var(--ledger-deep);
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
  }
  table.sens tbody th{
    background:var(--ledger);
    color:#F4F7EE;
    font-weight:600;
    text-align:right;
  }
  table.sens .corner{
    background:var(--ledger-deep) !important;
    color:var(--brass-light) !important;
    font-family:var(--font-body);
    font-weight:600;
    text-align:left;
    font-size:11px;
    letter-spacing:.04em;
  }
  table.sens td.cell{
    position:relative;
    color:var(--text);
    font-weight:500;
  }
  table.sens td.cell.neg{ color:var(--red); }
  table.sens td.cell.na{ color:var(--muted); font-style:italic; font-family:var(--font-body); font-size:12px; }
  table.sens td.cell.base-case{
    box-shadow:inset 0 0 0 2px var(--brass);
  }
  table.sens td.cell.base-case::after{
    content:'●';
    position:absolute;
    top:1px; right:3px;
    font-size:7px;
    color:var(--brass);
  }
  .legend{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:12px;
    font-size:11.5px;
    color:var(--muted);
  }
  .legend .swatch{ display:inline-flex; align-items:center; gap:6px; }
  .legend .box{ width:12px; height:12px; border-radius:3px; display:inline-block; border:1px solid var(--paper-rule); }
  .legend .dot{ color:var(--brass); font-size:9px; }

  .actions{ margin-top:14px; display:flex; gap:10px; }
  .btn{
    font-family:var(--font-body);
    font-size:12.5px;
    font-weight:600;
    background:#fff;
    border:1px solid var(--paper-rule);
    color:var(--text);
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
  }
  .btn:hover{ border-color:var(--ledger); }
  .btn.copied{ background:var(--green-bg); border-color:var(--ledger); }

  /* ---------- TORNADO ---------- */
  .tornado-metric{ margin-bottom:18px; }
  .tornado-chart{ background:#F8FAF4; border:1px solid var(--paper-rule); border-radius:8px; padding:18px 22px 8px; }
  .tornado-row{
    display:grid;
    grid-template-columns:168px 1fr;
    align-items:center;
    gap:14px;
    padding:9px 0;
    border-bottom:1px solid var(--paper-rule);
  }
  .tornado-row:last-child{ border-bottom:none; }
  .tornado-label{
    font-size:12.5px;
    font-weight:600;
    color:var(--text);
  }
  .bar-area{
    position:relative;
    height:22px;
  }
  .bar-baseline{
    position:absolute;
    top:-9px; bottom:-9px;
    width:1px;
    background:var(--brass);
    opacity:.55;
  }
  .bar-seg{
    position:absolute;
    top:3px;
    height:16px;
    border-radius:3px;
  }
  .bar-seg.fav{ background:var(--ledger); }
  .bar-seg.unfav{ background:var(--red); opacity:.82; }
  .bar-tag{
    position:absolute;
    top:-16px;
    transform:translateX(-50%);
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--muted);
    white-space:nowrap;
  }
  .tornado-foot{
    display:flex;
    justify-content:space-between;
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--muted);
    padding:10px 0 4px;
  }

  @media (max-width:860px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; flex:none; }
    .summary-strip{ grid-template-columns:repeat(2,1fr); }
    .tornado-row{ grid-template-columns:120px 1fr; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="masthead">
    <p class="eyebrow">Rental Property Underwriting</p>
    <h1>Deal Sheet.</h1>
    <p>Set your assumptions once, then stress-test the deal — pick any two inputs for a two-way table, or see every input ranked by how much it swings the number you care about.</p>
  </div>

  <div class="app">
    <div class="sidebar" id="sidebar"></div>
    <div class="main" id="main"></div>
  </div>
</div>

<script>
/* ---------------- MODEL DEFINITION ---------------- */

const INPUTS = [
  { key:'price', label:'Purchase price', group:'Purchase & financing', format:'currency', default:350000, step:5000, min:0, range:{min:250000,max:450000,step:25000} },
  { key:'downPct', label:'Down payment', group:'Purchase & financing', format:'percent', default:20, step:1, min:0, max:100, range:{min:10,max:30,step:5} },
  { key:'closingPct', label:'Closing costs', group:'Purchase & financing', format:'percent', default:3, step:0.5, min:0, range:{min:1,max:5,step:1} },
  { key:'rate', label:'Interest rate', group:'Purchase & financing', format:'percent', default:6.5, step:0.125, min:0, range:{min:4.5,max:8.5,step:0.5} },
  { key:'term', label:'Loan term', group:'Purchase & financing', format:'years', default:30, step:5, min:5, max:40, range:{min:15,max:30,step:5} },
  { key:'rent', label:'Monthly rent', group:'Income', format:'currency', default:2600, step:50, min:0, range:{min:2000,max:3200,step:200} },
  { key:'vacancyPct', label:'Vacancy rate', group:'Income', format:'percent', default:5, step:1, min:0, range:{min:0,max:15,step:3} },
  { key:'taxPct', label:'Property tax (of price/yr)', group:'Expenses', format:'percent', default:1.2, step:0.1, min:0, range:{min:0.6,max:2.4,step:0.3} },
  { key:'insurance', label:'Insurance (annual)', group:'Expenses', format:'currency', default:1400, step:100, min:0, range:{min:800,max:2400,step:400} },
  { key:'maintPct', label:'Maintenance (of rent)', group:'Expenses', format:'percent', default:8, step:1, min:0, range:{min:4,max:15,step:3} },
  { key:'mgmtPct', label:'Property management (of rent)', group:'Expenses', format:'percent', default:8, step:1, min:0, range:{min:0,max:12,step:3} },
  { key:'hoa', label:'HOA / other fees (monthly)', group:'Expenses', format:'currency', default:0, step:25, min:0, range:{min:0,max:300,step:75} },
];

const METRICS = {
  cashFlowMonthly: { label:'Monthly Cash Flow', format:'currency' },
  cashOnCash:      { label:'Cash-on-Cash Return', format:'percent' },
  capRate:         { label:'Cap Rate', format:'percent' },
  noiAnnual:        { label:'Net Operating Income (annual)', format:'currency' },
};

function computeMetrics(v){
  const loanAmt = v.price * (1 - v.downPct/100);
  const downAmt = v.price * v.downPct/100;
  const closingAmt = v.price * v.closingPct/100;
  const cashInvested = downAmt + closingAmt;
  const i = (v.rate/100)/12;
  const n = v.term*12;
  const mortgagePmt = i===0 ? loanAmt/n : loanAmt*i/(1-Math.pow(1+i,-n));
  const vacancyLoss = v.rent * v.vacancyPct/100;
  const effGrossIncome = v.rent - vacancyLoss;
  const taxMonthly = v.price*(v.taxPct/100)/12;
  const insMonthly = v.insurance/12;
  const maintMonthly = v.rent*v.maintPct/100;
  const mgmtMonthly = v.rent*v.mgmtPct/100;
  const opex = taxMonthly + insMonthly + maintMonthly + mgmtMonthly + v.hoa;
  const noiMonthly = effGrossIncome - opex;
  const noiAnnual = noiMonthly*12;
  const cashFlowMonthly = noiMonthly - mortgagePmt;
  const cashFlowAnnual = cashFlowMonthly*12;
  const capRate = v.price>0 ? (noiAnnual/v.price)*100 : 0;
  const cashOnCash = cashInvested>0 ? (cashFlowAnnual/cashInvested)*100 : 0;
  return { loanAmt, downAmt, closingAmt, cashInvested, mortgagePmt, cashFlowMonthly, cashFlowAnnual, noiAnnual, capRate, cashOnCash };
}

/* ---------------- STATE ---------------- */

const state = {
  inputs: Object.fromEntries(INPUTS.map(i=>[i.key,i.default])),
  metric: 'cashFlowMonthly',
  view: 'table',
  axes: {
    rowVar:'rate', colVar:'rent',
    rowRange: {...INPUTS.find(i=>i.key==='rate').range},
    colRange: {...INPUTS.find(i=>i.key==='rent').range},
  }
};

/* ---------------- HELPERS ---------------- */

function fmtCurrency(n){
  if(n==null || !isFinite(n)) return '—';
  const neg = n<0;
  const s = '$'+Math.round(Math.abs(n)).toLocaleString('en-US');
  return neg? '('+s+')': s;
}
function fmtPercent(n){
  if(n==null || !isFinite(n)) return '—';
  const neg = n<0;
  const s = Math.abs(n).toFixed(1)+'%';
  return neg? '('+s+')': s;
}
function fmtByFormat(n, format){
  return format==='currency' ? fmtCurrency(n) : fmtPercent(n);
}
function unitBadge(input){
  if(input.format==='currency') return {prefix:'$', suffix:''};
  if(input.format==='percent') return {prefix:'', suffix:'%'};
  if(input.format==='years') return {prefix:'', suffix:'yrs'};
  return {prefix:'', suffix:''};
}
function range(min,max,step){
  const out=[];
  if(!step || step<=0) step=1;
  if(min>max){ const t=min; min=max; max=t; }
  let v=min, guard=0;
  while(v<=max+1e-9 && guard<60){
    out.push(Math.round(v*10000)/10000);
    v+=step; guard++;
  }
  return out;
}
function mixColor(t, a, b){
  t = Math.max(0, Math.min(1, t));
  const r = Math.round(a[0]+(b[0]-a[0])*t);
  const g = Math.round(a[1]+(b[1]-a[1])*t);
  const bl = Math.round(a[2]+(b[2]-a[2])*t);
  return `rgb(${r},${g},${bl})`;
}
const RED_RGB=[241,214,205], GREEN_RGB=[215,231,204];

function inputByKey(k){ return INPUTS.find(i=>i.key===k); }

/* ---------------- SIDEBAR ---------------- */

function renderSidebar(){
  const sidebar = document.getElementById('sidebar');
  const groups = ['Purchase & financing','Income','Expenses'];
  let html = `<div class="sidebar-title">Property assumptions</div>
  <div class="sidebar-sub">Base case — every table and chart flexes around these.</div>`;

  groups.forEach(g=>{
    html += `<div class="field-group"><div class="field-group-label">${g}</div>`;
    INPUTS.filter(i=>i.group===g).forEach(inp=>{
      const badge = unitBadge(inp);
      html += `
        <div class="field">
          <label for="inp-${inp.key}">${inp.label}</label>
          <div class="field-input focus-ring">
            ${badge.prefix? `<span>${badge.prefix}</span>`:''}
            <input id="inp-${inp.key}" type="number" step="${inp.step}" ${inp.min!=null?`min="${inp.min}"`:''} ${inp.max!=null?`max="${inp.max}"`:''} value="${state.inputs[inp.key]}" data-key="${inp.key}">
            ${badge.suffix? `<span>${badge.suffix}</span>`:''}
          </div>
        </div>`;
    });
    html += `</div>`;
  });

  sidebar.innerHTML = html;
  sidebar.querySelectorAll('input[data-key]').forEach(el=>{
    el.addEventListener('input', e=>{
      const k = e.target.dataset.key;
      const val = parseFloat(e.target.value);
      state.inputs[k] = isNaN(val)? 0 : val;
      renderMain();
    });
  });
}

/* ---------------- SUMMARY STRIP ---------------- */

function summaryStripHTML(){
  const m = computeMetrics(state.inputs);
  const metricMeta = METRICS[state.metric];
  const metricVal = m[state.metric];
  return `
    <div class="summary-strip">
      <div class="stat">
        <div class="k">Loan amount</div>
        <div class="v">${fmtCurrency(m.loanAmt)}</div>
      </div>
      <div class="stat">
        <div class="k">Cash invested</div>
        <div class="v">${fmtCurrency(m.cashInvested)}</div>
      </div>
      <div class="stat">
        <div class="k">Monthly mortgage (P&amp;I)</div>
        <div class="v">${fmtCurrency(m.mortgagePmt)}</div>
      </div>
      <div class="stat highlight">
        <div class="k">${metricMeta.label} (base case)</div>
        <div class="v ${metricVal<0?'neg':''}">${fmtByFormat(metricVal, metricMeta.format)}</div>
      </div>
    </div>`;
}

/* ---------------- TWO-WAY TABLE VIEW ---------------- */

function tableControlsHTML(){
  const metricOptions = Object.entries(METRICS).map(([k,v])=>
    `<option value="${k}" ${state.metric===k?'selected':''}>${v.label}</option>`).join('');

  const rowOptions = INPUTS.map(i=>
    `<option value="${i.key}" ${state.axes.rowVar===i.key?'selected':''}>${i.label}</option>`).join('');
  const colOptions = INPUTS.map(i=>
    `<option value="${i.key}" ${state.axes.colVar===i.key?'selected':''}>${i.label}</option>`).join('');

  const rr = state.axes.rowRange, cr = state.axes.colRange;

  return `
    <div class="controls-row">
      <div class="control">
        <label>Output metric</label>
        <select id="ctl-metric">${metricOptions}</select>
      </div>
      <div class="control">
        <label>Row variable</label>
        <select id="ctl-rowvar">${rowOptions}</select>
      </div>
      <div class="control">
        <label>Row range</label>
        <div class="range-inputs">
          <input id="ctl-row-min" type="number" value="${rr.min}"> <span class="sep">to</span>
          <input id="ctl-row-max" type="number" value="${rr.max}"> <span class="sep">step</span>
          <input id="ctl-row-step" type="number" value="${rr.step}">
        </div>
      </div>
      <div class="control">
        <label>Column variable</label>
        <select id="ctl-colvar">${colOptions}</select>
      </div>
      <div class="control">
        <label>Column range</label>
        <div class="range-inputs">
          <input id="ctl-col-min" type="number" value="${cr.min}"> <span class="sep">to</span>
          <input id="ctl-col-max" type="number" value="${cr.max}"> <span class="sep">step</span>
          <input id="ctl-col-step" type="number" value="${cr.step}">
        </div>
      </div>
    </div>`;
}

function buildTableData(){
  const rowInput = inputByKey(state.axes.rowVar);
  const colInput = inputByKey(state.axes.colVar);
  const rowVals = range(state.axes.rowRange.min, state.axes.rowRange.max, state.axes.rowRange.step);
  const colVals = range(state.axes.colRange.min, state.axes.colRange.max, state.axes.colRange.step);

  const cells = rowVals.map(rv => colVals.map(cv => {
    const v = {...state.inputs, [state.axes.rowVar]: rv, [state.axes.colVar]: cv};
    const m = computeMetrics(v);
    return m[state.metric];
  }));

  const flat = cells.flat().filter(x=>isFinite(x));
  const min = Math.min(...flat), max = Math.max(...flat);

  const baseRowIdx = rowVals.reduce((best,val,idx)=>
    Math.abs(val-state.inputs[state.axes.rowVar]) < Math.abs(rowVals[best]-state.inputs[state.axes.rowVar]) ? idx : best, 0);
  const baseColIdx = colVals.reduce((best,val,idx)=>
    Math.abs(val-state.inputs[state.axes.colVar]) < Math.abs(colVals[best]-state.inputs[state.axes.colVar]) ? idx : best, 0);

  return { rowInput, colInput, rowVals, colVals, cells, min, max, baseRowIdx, baseColIdx };
}

function tableHTML(){
  const d = buildTableData();
  const metricMeta = METRICS[state.metric];
  const rowBadge = unitBadge(d.rowInput), colBadge = unitBadge(d.colInput);

  const fmtAxis = (val, inp, badge) => `${badge.prefix}${inp.format==='currency'? Math.round(val).toLocaleString('en-US') : val}${badge.suffix}`;

  let thead = `<thead>
    <tr class="axis-label"><th class="corner" rowspan="2">${metricMeta.label}</th><th colspan="${d.colVals.length}">Column: ${d.colInput.label}</th></tr>
    <tr><th>Row: ${d.rowInput.label} ▾</th>${d.colVals.map(cv=>`<th>${fmtAxis(cv,d.colInput,colBadge)}</th>`).join('')}</tr>
  </thead>`;

  let tbody = '<tbody>';
  d.rowVals.forEach((rv, ri)=>{
    tbody += `<tr><th>${fmtAxis(rv,d.rowInput,rowBadge)}</th>`;
    d.colVals.forEach((cv, ci)=>{
      const val = d.cells[ri][ci];
      const isBase = ri===d.baseRowIdx && ci===d.baseColIdx;
      if(!isFinite(val)){
        tbody += `<td class="cell na ${isBase?'base-case':''}">N/A</td>`;
      } else {
        const t = d.max===d.min ? 0.5 : (val-d.min)/(d.max-d.min);
        const bg = mixColor(t, RED_RGB, GREEN_RGB);
        const negClass = val<0 ? 'neg' : '';
        tbody += `<td class="cell ${negClass} ${isBase?'base-case':''}" style="background:${bg}">${fmtByFormat(val, metricMeta.format)}</td>`;
      }
    });
    tbody += '</tr>';
  });
  tbody += '</tbody>';

  return { html: `<div class="table-wrap"><table class="sens">${thead}${tbody}</table></div>`, data: d };
}

function renderTableView(container){
  container.innerHTML = `
    <h2 class="panel-title">Two-way sensitivity table</h2>
    <p class="panel-sub">Pick any two assumptions to vary against each other. Everything else stays at the base case shown in the sidebar.</p>
    ${tableControlsHTML()}
    <div id="table-holder"></div>
    <div class="legend">
      <span class="swatch"><span class="box" style="background:${mixColor(0,RED_RGB,GREEN_RGB)}"></span> Weaker</span>
      <span class="swatch"><span class="box" style="background:${mixColor(1,RED_RGB,GREEN_RGB)}"></span> Stronger</span>
      <span class="swatch"><span class="dot">●</span> Closest to base case</span>
      <span class="swatch">Parentheses = negative</span>
    </div>
    <div class="actions"><button class="btn" id="copy-csv">Copy table as CSV</button></div>
  `;

  const holder = container.querySelector('#table-holder');
  const built = tableHTML();
  holder.innerHTML = built.html;

  // control listeners
  container.querySelector('#ctl-metric').addEventListener('change', e=>{
    state.metric = e.target.value; renderMain();
  });
  container.querySelector('#ctl-rowvar').addEventListener('change', e=>{
    const key = e.target.value;
    if(key===state.axes.colVar){
      // swap to avoid duplicate axis
      state.axes.colVar = state.axes.rowVar;
      state.axes.colRange = state.axes.rowRange;
    }
    state.axes.rowVar = key;
    state.axes.rowRange = {...inputByKey(key).range};
    renderMain();
  });
  container.querySelector('#ctl-colvar').addEventListener('change', e=>{
    const key = e.target.value;
    if(key===state.axes.rowVar){
      state.axes.rowVar = state.axes.colVar;
      state.axes.rowRange = state.axes.colRange;
    }
    state.axes.colVar = key;
    state.axes.colRange = {...inputByKey(key).range};
    renderMain();
  });
  ['row-min','row-max','row-step'].forEach((id,idx)=>{
    const prop = ['min','max','step'][idx];
    container.querySelector('#ctl-'+id).addEventListener('change', e=>{
      state.axes.rowRange[prop] = parseFloat(e.target.value)||0;
      renderMain();
    });
  });
  ['col-min','col-max','col-step'].forEach((id,idx)=>{
    const prop = ['min','max','step'][idx];
    container.querySelector('#ctl-'+id).addEventListener('change', e=>{
      state.axes.colRange[prop] = parseFloat(e.target.value)||0;
      renderMain();
    });
  });

  container.querySelector('#copy-csv').addEventListener('click', async (e)=>{
    const d = built.data;
    const metricMeta = METRICS[state.metric];
    let rows = [[metricMeta.label+' / '+d.rowInput.label+' \\ '+d.colInput.label, ...d.colVals.map(v=>String(v))]];
    d.rowVals.forEach((rv,ri)=>{
      rows.push([String(rv), ...d.cells[ri].map(v=> isFinite(v)? v.toFixed(2) : 'N/A')]);
    });
    const csv = rows.map(r=>r.join(',')).join('\\n');
    try{
      await navigator.clipboard.writeText(csv);
      e.target.textContent = 'Copied ✓';
      e.target.classList.add('copied');
      setTimeout(()=>{ e.target.textContent='Copy table as CSV'; e.target.classList.remove('copied'); }, 1600);
    }catch(err){
      e.target.textContent = 'Copy failed — select manually';
    }
  });
}

/* ---------------- TORNADO VIEW ---------------- */

function renderTornadoView(container){
  const metricMeta = METRICS[state.metric];
  const base = computeMetrics(state.inputs)[state.metric];

  const rows = INPUTS.map(inp=>{
    const vLow = {...state.inputs, [inp.key]: inp.range.min};
    const vHigh = {...state.inputs, [inp.key]: inp.range.max};
    const mLow = computeMetrics(vLow)[state.metric];
    const mHigh = computeMetrics(vHigh)[state.metric];
    return { inp, mLow, mHigh, span: Math.abs(mHigh-mLow) };
  }).sort((a,b)=> b.span - a.span);

  const allVals = rows.flatMap(r=>[r.mLow, r.mHigh]).concat([base]).filter(isFinite);
  const xMin = Math.min(...allVals), xMax = Math.max(...allVals);
  const spanTotal = (xMax-xMin) || 1;
  const pct = v => ((v-xMin)/spanTotal)*100;
  const basePct = pct(base);

  const badgeFor = inp => unitBadge(inp);
  const axisLabel = (val, inp) => {
    const b = badgeFor(inp);
    return `${b.prefix}${inp.format==='currency'? Math.round(val).toLocaleString('en-US') : (Math.round(val*100)/100)}${b.suffix}`;
  };

  let rowsHTML = rows.map(r=>{
    const pLow = pct(r.mLow), pHigh = pct(r.mHigh);
    const segLowFav = r.mLow >= base;
    const segHighFav = r.mHigh >= base;
    const segLowLeft = Math.min(pLow, basePct), segLowWidth = Math.abs(pLow-basePct);
    const segHighLeft = Math.min(pHigh, basePct), segHighWidth = Math.abs(pHigh-basePct);
    return `
      <div class="tornado-row">
        <div class="tornado-label">${r.inp.label}</div>
        <div class="bar-area">
          <div class="bar-baseline" style="left:${basePct}%"></div>
          <div class="bar-seg ${segLowFav?'fav':'unfav'}" style="left:${segLowLeft}%; width:${segLowWidth}%"></div>
          <div class="bar-seg ${segHighFav?'fav':'unfav'}" style="left:${segHighLeft}%; width:${segHighWidth}%"></div>
          <div class="bar-tag" style="left:${pLow}%">${axisLabel(r.inp.range.min, r.inp)}</div>
          <div class="bar-tag" style="left:${pHigh}%">${axisLabel(r.inp.range.max, r.inp)}</div>
        </div>
      </div>`;
  }).join('');

  container.innerHTML = `
    <h2 class="panel-title">Tornado — every input, ranked</h2>
    <p class="panel-sub">Each bar flexes one assumption from its low to high value while holding everything else at the base case, showing which levers move ${metricMeta.label.toLowerCase()} the most.</p>
    <div class="tornado-metric control" style="display:inline-block; margin-bottom:18px;">
      <label>Output metric</label>
      <select id="ctl-tornado-metric">
        ${Object.entries(METRICS).map(([k,v])=>`<option value="${k}" ${state.metric===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
    </div>
    <div class="tornado-chart" style="margin-top:26px;">
      ${rowsHTML}
      <div class="tornado-foot">
        <span>${fmtByFormat(xMin, metricMeta.format)}</span>
        <span>Base case: ${fmtByFormat(base, metricMeta.format)}</span>
        <span>${fmtByFormat(xMax, metricMeta.format)}</span>
      </div>
    </div>
    <div class="legend" style="margin-top:14px;">
      <span class="swatch"><span class="box" style="background:var(--ledger)"></span> Improves the metric</span>
      <span class="swatch"><span class="box" style="background:var(--red)"></span> Weakens the metric</span>
      <span class="swatch">Brass line = base case</span>
    </div>
  `;

  container.querySelector('#ctl-tornado-metric').addEventListener('change', e=>{
    state.metric = e.target.value; renderMain();
  });
}

/* ---------------- MAIN RENDER ---------------- */

function renderMain(){
  const main = document.getElementById('main');
  main.innerHTML = `
    ${summaryStripHTML()}
    <div class="view-switch">
      <button id="sw-table" class="${state.view==='table'?'active':''}">Two-Way Table</button>
      <button id="sw-tornado" class="${state.view==='tornado'?'active':''}">Tornado: All Inputs</button>
    </div>
    <div id="view-holder"></div>
  `;
  main.querySelector('#sw-table').addEventListener('click', ()=>{ state.view='table'; renderMain(); });
  main.querySelector('#sw-tornado').addEventListener('click', ()=>{ state.view='tornado'; renderMain(); });

  const holder = main.querySelector('#view-holder');
  if(state.view==='table') renderTableView(holder);
  else renderTornadoView(holder);
}

renderSidebar();
renderMain();
</script>
